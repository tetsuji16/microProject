commons-lang3 = "3.21.0"
commons-text = "1.15.0"
commons-logging = "1.4.0"
jcl-over-slf4j = "2.0.20"
commons-pool = "1.6"
flatlaf = "3.8"
groovy = "3.0.25"
openpdf = "3.0.5"
radiance = "4.5.0"
flamingo = "5.0"
jakarta-jaxb-api = "4.0.5"
jaxb-runtime = "4.0.9"
jackson = "2.22.4"
jackson-annotations = "2.22"
jfreechart = "1.5.6"
netbeans = "RELEASE310"
mpxj = "16.11.0"
pdfbox = "3.0.8"
poi = "6.0.0"
slf4j = "2.0.20"
slf4j-simple = "2.0.20"
logback = "1.6.6"
log4j = "2.26.1"
junit-bom = "5.10.2"
junit4 = "4.13.2"
