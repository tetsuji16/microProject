<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CCPMの操作フロー</title>
  <desc id="desc">プロジェクトを開いて平準化ダイアログでCCPMを設定し、プレビュー、適用、グラフ確認、PODX保存を行う5段階の流れ。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="68" fill="#172554" font-family="Segoe UI, Meiryo, sans-serif" font-size="30" font-weight="700">CCPMを使った計画・確認・保存</text>
  <text x="60" y="102" fill="#475569" font-family="Segoe UI, Meiryo, sans-serif" font-size="17">リソース制約を考慮したクリティカルチェーンを、プレビューで確認してから適用します。</text>

  <g font-family="Segoe UI, Meiryo, sans-serif">
    <g filter="url(#shadow)">
      <rect x="55" y="155" width="205" height="260" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="91" cy="195" r="24" fill="#2563eb"/><text x="91" y="203" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
      <text x="130" y="202" fill="#1e3a8a" font-size="20" font-weight="700">準備</text>
      <text x="78" y="253" fill="#334155" font-size="16">プロジェクトを開く</text>
      <text x="78" y="282" fill="#334155" font-size="16">依存関係と担当者を確認</text>
      <text x="78" y="338" fill="#64748b" font-size="14">過剰割り当てがある場合は、</text>
      <text x="78" y="361" fill="#64748b" font-size="14">先にリソースを整理します。</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="285" y="155" width="205" height="260" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="321" cy="195" r="24" fill="#2563eb"/><text x="321" y="203" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
      <text x="360" y="202" fill="#1e3a8a" font-size="20" font-weight="700">設定</text>
      <text x="308" y="253" fill="#334155" font-size="16">リソース →</text>
      <text x="308" y="282" fill="#334155" font-size="16">リソースの平準化</text>
      <text x="308" y="338" fill="#64748b" font-size="14">CCPMを使用するにチェックし、</text>
      <text x="308" y="361" fill="#64748b" font-size="14">バッファ割合と対象リソースを選択。</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="515" y="155" width="205" height="260" rx="18" fill="#fff" stroke="#bfdbfe" stroke-width="2"/>
      <circle cx="551" cy="195" r="24" fill="#2563eb"/><text x="551" y="203" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
      <text x="590" y="202" fill="#1e3a8a" font-size="20" font-weight="700">プレビュー</text>
      <text x="538" y="253" fill="#334155" font-size="16">プレビューを押す</text>
      <text x="538" y="282" fill="#334155" font-size="16">変更件数とバッファを確認</text>
      <text x="538" y="338" fill="#64748b" font-size="14">未解決の競合があれば、設定や</text>
      <text x="538" y="361" fill="#64748b" font-size="14">割り当てを見直して再計算します。</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="745" y="155" width="205" height="260" rx="18" fill="#fff" stroke="#bbf7d0" stroke-width="2"/>
      <circle cx="781" cy="195" r="24" fill="#16a34a"/><text x="781" y="203" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
      <text x="820" y="202" fill="#166534" font-size="20" font-weight="700">適用・確認</text>
      <text x="768" y="253" fill="#334155" font-size="16">平準化を適用</text>
      <text x="768" y="282" fill="#334155" font-size="16">CCPM Network タブを確認</text>
      <text x="768" y="338" fill="#64748b" font-size="14">赤いチェーン、プロジェクト</text>
      <text x="768" y="361" fill="#64748b" font-size="14">バッファ、フィーディングバッファを確認。</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="975" y="155" width="170" height="260" rx="18" fill="#fff" stroke="#fed7aa" stroke-width="2"/>
      <circle cx="1011" cy="195" r="24" fill="#ea580c"/><text x="1011" y="203" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">5</text>
      <text x="1050" y="202" fill="#9a3412" font-size="20" font-weight="700">保存</text>
      <text x="992" y="253" fill="#334155" font-size="16">名前を付けて保存</text>
      <text x="992" y="282" fill="#334155" font-size="16">推奨: .podx</text>
      <text x="992" y="338" fill="#64748b" font-size="14">CCPM設定を保持し、</text>
      <text x="992" y="361" fill="#64748b" font-size="14">共有フォルダーで編集できます。</text>
    </g>
    <path d="M260 285 H280" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M490 285 H510" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M720 285 H740" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M950 285 H970" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <rect x="55" y="475" width="1090" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="80" y="511" fill="#9a3412" font-family="Segoe UI, Meiryo, sans-serif" font-size="17" font-weight="700">保存形式の注意</text>
  <text x="80" y="540" fill="#7c2d12" font-family="Segoe UI, Meiryo, sans-serif" font-size="15">従来の .pod は元の形式のまま読み書きします。CCPM設定や共同編集の状態を保持する場合は .podx を使用してください。</text>
</svg>
