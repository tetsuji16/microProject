<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1680" height="1030" viewBox="0 0 1680 1030" role="img" aria-labelledby="title desc">
  <title id="title">ガントチャートのアイコン・バー・線の見方</title>
  <desc id="desc">microProjectの実画面に番号付きの吹き出しを重ね、指標アイコン、ガントバー、依存関係線、プロジェクト開始日、クリティカルタスクを説明した図。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".22"/></filter>
    <style>
      .panel { font-family: "Yu Gothic", "Meiryo", sans-serif; fill: #172033; }
      .label { font-size: 22px; font-weight: 700; }
      .small { font-size: 17px; }
      .num { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: white; text-anchor: middle; dominant-baseline: central; }
      .line { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1680" height="1030" fill="#eef2f7"/>
  <rect x="18" y="18" width="1167" height="903" rx="8" fill="white" filter="url(#shadow)"/>
  <image x="18" y="18" width="1167" height="903" preserveAspectRatio="none" xlink:href="demo_gannt.png"/>

  <!-- numbered targets on the real screen -->
  <g>
    <circle cx="86" cy="207" r="20" fill="#2563eb"/><text x="86" y="207" class="num">1</text>
    <circle cx="64" cy="254" r="20" fill="#16a34a"/><text x="64" y="254" class="num">2</text>
    <circle cx="64" cy="398" r="20" fill="#d97706"/><text x="64" y="398" class="num">3</text>
    <circle cx="720" cy="386" r="20" fill="#d97706"/><text x="720" y="386" class="num">4</text>
    <circle cx="536" cy="405" r="20" fill="#16a34a"/><text x="536" y="405" class="num">5</text>
    <circle cx="704" cy="519" r="20" fill="#dc2626"/><text x="704" y="519" class="num">6</text>
    <circle cx="593" cy="462" r="20" fill="#475569"/><text x="593" y="462" class="num">7</text>
    <circle cx="475" cy="236" r="20" fill="#7c3aed"/><text x="475" y="236" class="num">8</text>
  </g>

  <!-- callout connectors -->
  <g class="line">
    <path d="M86 207 H1210"/><path d="M64 254 H1210"/><path d="M64 398 H1210"/>
    <path d="M720 386 H1210"/><path d="M536 405 H1210"/><path d="M704 519 H1210"/>
    <path d="M593 462 H1210"/><path d="M475 236 H1210"/>
  </g>

  <!-- explanation panel -->
  <rect x="1208" y="18" width="454" height="903" rx="8" fill="white" filter="url(#shadow)"/>
  <text x="1232" y="60" class="panel label">番号で見る読み方</text>
  <text x="1232" y="88" class="panel small" fill="#64748b">実画面の同じ番号を探してください。</text>

  <g class="panel">
    <text x="1232" y="132" class="label"><tspan fill="#2563eb">①</tspan> 指標列の案内</text>
    <text x="1232" y="158" class="small">列見出しの「i」は案内です。</text>
    <text x="1232" y="181" class="small">各行の状態を表すアイコンではありません。</text>

    <text x="1232" y="225" class="label"><tspan fill="#16a34a">②</tspan> 完了アイコン</text>
    <text x="1232" y="251" class="small">緑のチェックは達成率100%。</text>

    <text x="1232" y="295" class="label"><tspan fill="#d97706">③</tspan> メモアイコン</text>
    <text x="1232" y="321" class="small">黄色のメモはタスクに補足あり。</text>

    <text x="1232" y="365" class="label"><tspan fill="#d97706">④</tspan> 要約タスク</text>
    <text x="1232" y="391" class="small">太いバーの端の下向き記号が、</text>
    <text x="1232" y="414" class="small">子タスク全体の開始・終了を示します。</text>

    <text x="1232" y="458" class="label"><tspan fill="#16a34a">⑤</tspan> 完了したタスク</text>
    <text x="1232" y="484" class="small">緑のバーは完了済み。</text>

    <text x="1232" y="528" class="label"><tspan fill="#dc2626">⑥</tspan> クリティカルタスク</text>
    <text x="1232" y="554" class="small">赤／ピンクは余裕がなく、</text>
    <text x="1232" y="577" class="small">遅れると完了日へ影響しやすいタスク。</text>

    <text x="1232" y="621" class="label"><tspan fill="#475569">⑦</tspan> 依存関係</text>
    <text x="1232" y="647" class="small">矢印の先が後続タスク。</text>
    <text x="1232" y="670" class="small">前提作業から順にたどります。</text>

    <text x="1232" y="714" class="label"><tspan fill="#7c3aed">⑧</tspan> プロジェクト開始日</text>
    <text x="1232" y="740" class="small">青い縦の破線です。</text>
  </g>

  <rect x="1232" y="780" width="406" height="112" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1252" y="812" class="panel label" font-size="19">読む順番</text>
  <text x="1252" y="840" class="panel small">①②③でタスク表の状態を確認 →</text>
  <text x="1252" y="865" class="panel small">④⑤⑥でバーの意味を確認 →</text>
  <text x="1252" y="890" class="panel small">⑦⑧で順序と基準日を確認</text>

  <text x="18" y="966" class="panel small" fill="#475569">図：docs/images/demo_gannt.png の実画面を説明用に注釈。色は個別設定で変わる場合があります。</text>
</svg>
