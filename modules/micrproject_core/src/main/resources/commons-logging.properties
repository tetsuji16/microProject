# Force commons-logging to use the JDK 1.4 logger instead of auto-discovering
# log4j2 / logback. Auto-discovery triggers a StackWalker recursion
# (StackOverflowError) on modern JDKs and a logback ThrowableProxy init failure,
# which breaks Configuration.getInstance() (Digester config parse) and therefore
# .pod loading. See issue #154.
org.apache.commons.logging.Log=org.apache.commons.logging.impl.Jdk14Logger
