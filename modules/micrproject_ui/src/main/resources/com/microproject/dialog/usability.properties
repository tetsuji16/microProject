diagnostic.manual.summary=Dates are manually scheduled
diagnostic.manual.cause=Automatic dependency and calendar calculations cannot move this task.
diagnostic.manual.recommendation=Switch to automatic scheduling if links should determine its dates.
diagnostic.missed_deadline.summary=Finish is after the deadline
diagnostic.missed_deadline.cause=The scheduled finish exceeds the task deadline.
diagnostic.missed_deadline.recommendation=Shorten the work, add capacity, revise links, or move the deadline.
diagnostic.negative_slack.summary=Task has negative total slack
diagnostic.negative_slack.cause=Constraints, dependencies, or resource delays require more time than the plan permits.
diagnostic.negative_slack.recommendation=Inspect predecessor links and constraints, then remove or relax the limiting condition.
diagnostic.hard_constraint.summary=Task has a date constraint
diagnostic.hard_constraint.cause=A non-flexible constraint can override normal dependency scheduling.
diagnostic.hard_constraint.recommendation=Use an ASAP/ALAP constraint when the date is not contractually fixed.
diagnostic.late_incomplete_work.summary=Incomplete work is before the status date
diagnostic.late_incomplete_work.cause=The task is not complete although its scheduled finish is in the past.
diagnostic.late_incomplete_work.recommendation=Update actual progress or reschedule the remaining work after the status date.
diagnostic.overallocated_resource.summary=Assigned resource is overallocated
diagnostic.overallocated_resource.cause=Concurrent assignments exceed the resource's maximum units.
diagnostic.overallocated_resource.recommendation=Reassign the task, change assignment units, or run resource leveling.
diagnostic.no_issues.summary=No scheduling issues detected
diagnostic.no_issues.cause=The current dates are consistent with the inspected scheduling rules.
diagnostic.no_issues.recommendation=No action is required.
