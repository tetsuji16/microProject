diagnostic.inactive.summary=タスクは非アクティブです
diagnostic.inactive.cause=比較用に保持されていますが、依存関係やサマリー集計には影響しません。
diagnostic.inactive.recommendation=確定計画に含める段階でタスクをアクティブにしてください。
diagnostic.manual.summary=日付は手動でスケジュールされています
diagnostic.manual.cause=依存関係やカレンダーの自動計算では、このタスクを移動できません。
diagnostic.manual.recommendation=リンクによって日付を決める場合は自動スケジュールへ切り替えてください。
diagnostic.dependency_conflict.summary=日付が先行タスクと矛盾しています
diagnostic.dependency_conflict.cause=タスクの開始または終了が、有効な先行関係で許容される日付より前です。
diagnostic.dependency_conflict.recommendation=自動スケジュールへ切り替えるか、日付、リンク、またはラグを修正してください。
diagnostic.missed_deadline.summary=終了日が期限を超えています
diagnostic.missed_deadline.cause=スケジュール終了日がタスクの期限より後です。
diagnostic.missed_deadline.recommendation=作業短縮、要員追加、リンク修正、または期限変更を検討してください。
diagnostic.negative_slack.summary=総余裕期間が負です
diagnostic.negative_slack.cause=制約、依存関係、またはリソース遅延により、計画で許容される以上の時間が必要です。
diagnostic.negative_slack.recommendation=先行タスクと制約を確認し、制限条件を削除または緩和してください。
diagnostic.hard_constraint.summary=日付制約があります
diagnostic.hard_constraint.cause=柔軟性のない制約は通常の依存関係スケジュールより優先されます。
diagnostic.hard_constraint.recommendation=日付が契約上固定でなければ「できるだけ早く／遅く」を使用してください。
diagnostic.late_incomplete_work.summary=未完了作業が基準日より前にあります
diagnostic.late_incomplete_work.cause=終了予定日が過去ですが、タスクは完了していません。
diagnostic.late_incomplete_work.recommendation=実績進捗を更新するか、残作業を基準日より後へ再日程化してください。
diagnostic.overallocated_resource.summary=割り当てリソースが超過しています
diagnostic.overallocated_resource.cause=同時割り当てがリソースの最大単位を超えています。
diagnostic.overallocated_resource.recommendation=担当変更、割り当て単位変更、またはリソース平準化を実行してください。
diagnostic.no_issues.summary=スケジュール上の問題は検出されませんでした
diagnostic.no_issues.cause=現在の日付は検査対象のスケジュール規則と整合しています。
diagnostic.no_issues.recommendation=対応は不要です。
