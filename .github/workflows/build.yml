name: Build

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Runner for manual diagnostic builds'
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Release builds test on every OS, so a pull request has to as well; all results arrive in one run.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.runner_os)) || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install fonts used by report rendering tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify architecture and naming boundaries
        if: runner.os == 'Linux'
        run: bash ./gradlew verifyArchitectureBoundaries verifyArchitectureBoundaryFixtures verifyNamingConventions --console=plain

      - name: Test repository maintenance scripts
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/test_source_inventory.py --check --output build/audit/test-source-inventory.json

      - name: Build and test with Gradle
        run: ${{ runner.os == 'Windows' && '.\gradlew.bat' || 'bash ./gradlew' }} build installDist --console=plain

      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-test-evidence-${{ github.run_id }}-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            modules/**/build/reports/tests/test
            modules/**/build/test-results/test
            build/audit/test-source-inventory.json

  build:
    # The required status check; it passes only when every OS in verify passed.
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require every OS to pass
        run: test "${{ needs.verify.result }}" = success
