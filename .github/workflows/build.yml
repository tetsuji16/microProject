name: Build

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install fonts used by report rendering tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify architecture boundaries
        run: bash ./gradlew verifyArchitectureBoundaries --console=plain

      - name: Test repository maintenance scripts
        run: python -m unittest discover -s scripts/tests -v

      - name: Build and test with Gradle
        run: bash ./gradlew clean build installDist --console=plain
