name: GUI runner desktop diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/gui-runner-desktop-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: gui-runner-desktop-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop-diagnostics:
    name: Desktop policy diagnostics
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Inspect runner identity and notification policy registry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [System.Security.Principal.WindowsPrincipal]::new($identity)
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          Write-Host "Identity: $($identity.Name) SID=$($identity.User.Value) IsAdministrator=$($principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator))"
          Write-Host "OS: $($os.Caption) version=$($os.Version) build=$($os.BuildNumber)"
          whoami.exe /groups

          $inspectedKeys = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\PushNotifications',
            'HKCU:\Software\Policies\Microsoft\Windows\Explorer'
          )
          foreach ($keyPath in $inspectedKeys) {
            Write-Host "Registry key: $keyPath"
            try {
              if (-not (Test-Path -LiteralPath $keyPath)) {
                Write-Host '  State: missing'
                continue
              }
              $acl = Get-Acl -LiteralPath $keyPath
              Write-Host "  Owner: $($acl.Owner)"
              Write-Host "  SDDL: $($acl.Sddl)"
              $acl.Access | ForEach-Object {
                Write-Host "  ACE: Identity=$($_.IdentityReference) Type=$($_.AccessControlType) Rights=$($_.RegistryRights) Inherited=$($_.IsInherited)"
              }
            } catch {
              Write-Host "  Inspection error: $($_.Exception.Message)"
            }
          }

          function Test-RegistryDwordWriteAndRestore([string]$KeyPath, [string]$ValueName, [int]$ProbeValue) {
            $nativePath = $KeyPath -replace '^HKCU:\\', ''
            $keyExisted = $false
            $valueExisted = $false
            $snapshotComplete = $false
            $originalValue = $null
            $originalKind = $null
            $createdPaths = [System.Collections.Generic.List[string]]::new()
            $result = 'not attempted'
            $restoreFailure = $null
            try {
              $keyExisted = Test-Path -LiteralPath $KeyPath
              $pathPrefix = ''
              foreach ($segment in $nativePath.Split('\')) {
                $pathPrefix = if ([string]::IsNullOrEmpty($pathPrefix)) { $segment } else { "$pathPrefix\$segment" }
                $pathProbe = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($pathPrefix, $false)
                if ($null -eq $pathProbe) { $createdPaths.Add($pathPrefix) }
                else { $pathProbe.Dispose() }
              }
              if ($keyExisted) {
                $readKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($nativePath, $false)
                if ($null -eq $readKey) { throw 'Could not open the existing registry key for read access' }
                $valueExisted = $readKey.GetValueNames() -contains $ValueName
                if ($valueExisted) {
                  $originalValue = $readKey.GetValue($ValueName)
                  $originalKind = $readKey.GetValueKind($ValueName)
                  if ($originalKind -ne [Microsoft.Win32.RegistryValueKind]::DWord) {
                    $readKey.Dispose()
                    throw "Existing $ValueName is $originalKind, not DWord; no write was attempted"
                  }
                }
                $readKey.Dispose()
              }
              $snapshotComplete = $true
              Write-Host "Registry probe before write: key=$KeyPath exists=$keyExisted value=$ValueName exists=$valueExisted value=$originalValue kind=$originalKind"
              New-Item -Path $KeyPath -Force | Out-Null
              New-ItemProperty -LiteralPath $KeyPath -Name $ValueName -PropertyType DWord -Value $ProbeValue -Force | Out-Null
              $readKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($nativePath, $false)
              if ($null -eq $readKey) { throw 'Could not reopen the registry key after the write' }
              $observedValue = $readKey.GetValue($ValueName)
              $readKey.Dispose()
              if ([int]$observedValue -ne $ProbeValue) { throw "Write readback mismatch; observed=$observedValue expected=$ProbeValue" }
              $result = 'write and readback succeeded'
            } catch {
              $result = "write or readback failed: $($_.Exception.Message)"
            } finally {
              if ($snapshotComplete) {
                try {
                  $currentKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($nativePath, $false)
                  $currentExists = $null -ne $currentKey -and ($currentKey.GetValueNames() -contains $ValueName)
                  $currentValue = if ($currentExists) { $currentKey.GetValue($ValueName) } else { $null }
                  $currentKind = if ($currentExists) { $currentKey.GetValueKind($ValueName) } else { $null }
                  if ($null -ne $currentKey) { $currentKey.Dispose() }
                  if ($valueExisted) {
                    if (-not $currentExists -or $currentValue -ne $originalValue -or $currentKind -ne $originalKind) {
                      New-ItemProperty -LiteralPath $KeyPath -Name $ValueName -PropertyType $originalKind.ToString() -Value $originalValue -Force | Out-Null
                    }
                    $verifyKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($nativePath, $false)
                    if ($null -eq $verifyKey -or $verifyKey.GetValue($ValueName) -ne $originalValue -or $verifyKey.GetValueKind($ValueName) -ne $originalKind) {
                      throw "Could not restore original $ValueName value"
                    }
                    $verifyKey.Dispose()
                  } elseif ($currentExists) {
                    Remove-ItemProperty -LiteralPath $KeyPath -Name $ValueName -ErrorAction Stop
                  }
                  if (-not $valueExisted) {
                    $verifyKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($nativePath, $false)
                    if ($null -ne $verifyKey) {
                      $probeValueRemains = $verifyKey.GetValueNames() -contains $ValueName
                      $verifyKey.Dispose()
                      if ($probeValueRemains) { throw "Temporary $ValueName value remains after cleanup" }
                    }
                  }
                  for ($pathIndex = $createdPaths.Count - 1; $pathIndex -ge 0; $pathIndex--) {
                    $createdPath = $createdPaths[$pathIndex]
                    $createdKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($createdPath, $false)
                    if ($null -eq $createdKey) { continue }
                    $isEmpty = $createdKey.GetValueNames().Length -eq 0 -and $createdKey.GetSubKeyNames().Length -eq 0
                    $createdKey.Dispose()
                    if (-not $isEmpty) { throw "Refusing to remove non-empty temporary registry key $createdPath" }
                    [Microsoft.Win32.Registry]::CurrentUser.DeleteSubKey($createdPath, $false)
                  }
                } catch {
                  $restoreFailure = $_.Exception.Message
                  Write-Error "Registry probe restoration failed: $restoreFailure"
                }
              } else {
                Write-Host "Registry probe stopped before mutation because the original state could not be read: $KeyPath\$ValueName"
              }
            }
            if ($null -ne $restoreFailure) { throw "Registry probe restoration failed: $restoreFailure" }
            Write-Host "Registry probe result: $result; original state restored and verified when write was attempted"
            return $result
          }

          $toastResult = Test-RegistryDwordWriteAndRestore `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\PushNotifications' 'ToastEnabled' 0
          $policyKey = 'HKCU:\Software\Policies\Microsoft\Windows\Explorer'
          $policyResult = Test-RegistryDwordWriteAndRestore $policyKey 'DisableNotificationCenter' 1
          $summary = @(
            '## GUI runner desktop policy diagnostics',
            '',
            "- Runner identity: ``$($identity.Name)`` (SID ``$($identity.User.Value)``); Administrator=$($principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator).ToString().ToLowerInvariant()).",
            "- OS: ``$($os.Caption)`` version ``$($os.Version)`` build ``$($os.BuildNumber)``.",
            "- HKCU PushNotifications ToastEnabled: $toastResult.",
            "- ``$policyKey\DisableNotificationCenter``: $policyResult.",
            '- This run does not launch GUI tests and does not retain a policy change.',
            '- Microsoft documents that the Remove Notifications and Action Center policy requires a reboot to take effect: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-taskbar . The diagnostic does not reboot the hosted runner.'
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($summary -join [Environment]::NewLine)
