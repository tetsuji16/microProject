name: GUI acceptance audit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      gui_suite:
        description: 'GUI suite (scheduled audits always use full)'
        required: false
        default: full
        type: choice
        options:
          - smoke
          - visual
          - full
      gui_test_filter:
        description: 'Optional targeted Gradle test filter (FQCN or FQCN.method); manual dispatch only'
        required: false
        type: string
      gui_test_locale:
        description: 'Locale for a manual targeted test only'
        required: false
        default: ja
        type: choice
        options:
          - ja
          - en
      gui_test_scale:
        description: 'UI scale for a manual targeted test only'
        required: false
        default: '1.0'
        type: choice
        options:
          - '1.0'
          - '1.25'
          - '1.5'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: gui-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-gui-matrix:
    name: Full GUI locale and DPI matrix
    runs-on: windows-latest
    # A full GUI run has a 45-minute functional watchdog plus five additional
    # 20-minute visual legs; Japanese 100% visual coverage is in the full run.
    # Leave time outside the GUI step for build/setup and failure evidence upload.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build fresh desktop install
        shell: pwsh
        run: .\gradlew.bat installDist --console=plain

      - name: Verify GUI gate exit-code handoff
        shell: pwsh
        run: .\.github\scripts\test-gui-gate-exit-code.ps1

      - name: Verify desktop monitor watcher lifecycle
        shell: pwsh
        run: .\.github\scripts\test-gui-desktop-monitor-lifecycle.ps1

      - name: Run selected GUI acceptance suite and visual matrix
        shell: pwsh
        env:
          GUI_TEST_FILTER: ${{ inputs.gui_test_filter }}
          GUI_TEST_LOCALE: ${{ inputs.gui_test_locale }}
          GUI_TEST_SCALE: ${{ inputs.gui_test_scale }}
        timeout-minutes: 175
        run: |
          $requestedSuite = '${{ inputs.gui_suite }}'
          if ([string]::IsNullOrWhiteSpace($requestedSuite)) {
            if ($env:GITHUB_EVENT_NAME -eq 'schedule') { $requestedSuite = 'full' }
            elseif ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and '${{ github.head_ref }}' -like 'codex/stable-*') {
              $requestedSuite = 'full'
            } else { $requestedSuite = 'smoke' }
          }
          $requiredContext = 'Full GUI locale and DPI matrix'
          $filter = '${{ inputs.gui_test_filter }}'
          $runKind = if (-not [string]::IsNullOrWhiteSpace($filter)) { "targeted ($filter; suite=$requestedSuite)" } else { $requestedSuite }
          $lines = @(
            '## GUI acceptance gate',
            '',
            "- Required branch-protection context: ``$requiredContext`` (retained for compatibility).",
            "- Actual run: ``$runKind``; event: ``$env:GITHUB_EVENT_NAME``.",
            '- Smoke runs execute the Japanese 100% functional suite only. Full and visual runs also execute the locale/scale visual matrix.',
            '- Display bounds are observed and recorded; the workflow does not change screen resolution.'
          )
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join [Environment]::NewLine)
          Write-Host "Selected GUI suite: $requestedSuite (event=$env:GITHUB_EVENT_NAME)"
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:GUI_TEST_FILTER)) {
            $focusedLocale = if ([string]::IsNullOrWhiteSpace($env:GUI_TEST_LOCALE)) { 'ja' } else { $env:GUI_TEST_LOCALE }
            $focusedScale = if ([string]::IsNullOrWhiteSpace($env:GUI_TEST_SCALE)) { '1.0' } else { $env:GUI_TEST_SCALE }
            .\.github\scripts\run-gui-acceptance.ps1 -Suite $requestedSuite -TestFilter $env:GUI_TEST_FILTER -Locale $focusedLocale -Scale $focusedScale
          } else {
            .\.github\scripts\run-gui-acceptance.ps1 -Suite $requestedSuite
          }

      - name: Capture GUI failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnostics = 'modules/microproject_ui/build/reports/guiTest-artifacts'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          Get-Process java,javaw -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,CPU,StartTime,Path |
            Out-File (Join-Path $diagnostics 'java-processes.txt')
          $jcmd = Join-Path $env:JAVA_HOME 'bin/jcmd.exe'
          if (-not (Test-Path -LiteralPath $jcmd)) { $jcmd = 'jcmd' }
          Get-Process java,javaw -ErrorAction SilentlyContinue | ForEach-Object {
            $dump = Join-Path $diagnostics ("thread-dump-$($_.Id).txt")
            & $jcmd $_.Id Thread.print 2>&1 | Out-File $dump
          }

      - name: Upload GUI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-audit-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: |
            modules/microproject_ui/build/reports/tests/guiTest
            modules/microproject_ui/build/test-results/guiTest
            modules/microproject_ui/build/reports/guiTest-artifacts
