name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-and-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install WiX
        shell: pwsh
        run: |
          # JDK 25's jpackage supports WiX 4/5. Use WiX 5 so MSI generation
          # handles all registered file associations, including .mpo.
          dotnet tool install --global wix --version 5.0.2 --add-source https://api.nuget.org/v3/index.json
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          $env:USERPROFILE + '\.dotnet\tools' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix --version

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $baseVersion = (Select-String -Path build.gradle.kts -Pattern 'version = .*"([0-9]+\.[0-9]+\.[0-9]+)"').Matches[0].Groups[1].Value
          $releaseVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare update signing key
        id: signing
        shell: pwsh
        env:
          UPDATE4J_PRIVATE_KEY: ${{ secrets.UPDATE4J_PRIVATE_KEY }}
          UPDATE4J_PUBLIC_KEY: ${{ secrets.UPDATE4J_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:UPDATE4J_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:UPDATE4J_PUBLIC_KEY)) {
            'configured=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $keyFile = Join-Path $env:RUNNER_TEMP 'microproject-update-private.pem'
          $publicFile = 'modules/micrproject_bootstrap/src/main/resources/com/microproject/bootstrap/public.key'
          [IO.File]::WriteAllText($keyFile, $env:UPDATE4J_PRIVATE_KEY)
          [IO.File]::WriteAllText($publicFile, $env:UPDATE4J_PUBLIC_KEY)
          "UPDATE4J_PRIVATE_KEY_FILE=$keyFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'configured=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build, package, and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat clean build packageWindowsMsi packageWindowsZip verifyPackagedFileImports "-PreleaseVersion=${{ steps.version.outputs.release_version }}" --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release assets
        if: ${{ success() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.release_version }}'
          New-Item -ItemType Directory -Path release-assets | Out-Null
          # Windows Installer normalizes the MSI version to its supported format,
          # so its output filename may not retain the CI run-number suffix.
          # Locate the package produced by this clean build, then publish it
          # under the GitHub release version calculated above.
          # jpackage may emit either microProject.msi or a versioned name.
          $msi = Get-ChildItem -Path build/releases -Recurse -File -Filter 'microProject*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            $msi = Get-ChildItem -Path build/releases -Recurse -File -Filter '*.msi' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          # packageWindowsZip normally writes to docs/downloads, but a clean
          # checkout may not contain that ignored/empty directory. Fall back to
          # the build tree so staging reports the real packaging failure instead
          # of failing on directory enumeration (issue #430).
          $zip = Get-ChildItem -Path docs/downloads -File -Filter 'microProject-*-app-image.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $zip) {
            $zip = Get-ChildItem -Path build -Recurse -File -Filter 'microProject-*-app-image.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $msi) { throw 'The Windows MSI package was not produced.' }
          if ($null -eq $zip) { throw 'The Windows app-image ZIP was not produced.' }
          Copy-Item $msi.FullName "release-assets/microProject-$version.msi"
          Copy-Item $zip.FullName "release-assets/microProject-$version-app-image.zip"
          Copy-Item "release-assets/microProject-$version.msi" "release-assets/microProject-latest.msi"
          Copy-Item "release-assets/microProject-$version-app-image.zip" "release-assets/microProject-latest-app-image.zip"

          $appLib = Get-ChildItem -Path build/releases -Recurse -Directory -Filter app | Select-Object -First 1
          if ($null -eq $appLib) { throw 'The staged app directory was not found.' }
          Get-ChildItem -Path $appLib.FullName -File -Filter '*.jar' | ForEach-Object {
            Copy-Item $_.FullName "release-assets/microProject-$version-$($_.Name)"
          }

      - name: Generate signed update configuration
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat generateUpdateConfiguration --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = '${{ steps.version.outputs.release_version }}'
          $manifest = Get-ChildItem -Path build/releases -Recurse -File -Filter configuration.xml | Select-Object -First 1
          if ($null -eq $manifest) { throw 'The signed update configuration was not produced.' }
          Copy-Item $manifest.FullName 'release-assets/configuration.xml'

      - name: Report update signing configuration
        if: ${{ steps.signing.outputs.configured != 'true' }}
        shell: pwsh
        run: Write-Host 'UPDATE4J_PRIVATE_KEY and UPDATE4J_PUBLIC_KEY are not configured; publishing without auto-update manifest. Bootstrap will safely fall back.'

      - name: Create GitHub release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: microProject v${{ steps.version.outputs.release_version }}
          generate_release_notes: true
          files: release-assets/*
