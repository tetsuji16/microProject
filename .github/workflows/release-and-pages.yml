name: Release and deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-and-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install WiX
        shell: pwsh
        run: |
          # jpackage MSI builds fail with WiX 3.14 (light.exe LGHT0094, JDK-8319571).
          # The runner image only ships WiX 3.14 via choco, and choco no longer
          # publishes a 3.11 package (3.11.2.4516 does not exist there), so download
          # the standalone WiX 3.11.2 binaries and put them on PATH.
          # build.gradle.kts's packageWindowsMsi prepends its own WiX v7.0 path which
          # does not exist on CI, so this GITHUB_PATH entry is what actually wins.
          $wixUrl = 'https://github.com/wixtoolset/wix3/releases/download/wix3112/wix311-binaries.zip'
          Invoke-WebRequest -Uri $wixUrl -OutFile wix311.zip -MaximumRedirection 10
          Expand-Archive -Path wix311.zip -DestinationPath wix311 -Force
          $wixBin = Join-Path $PWD 'wix311'
          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          where.exe candle.exe
          & "$wixBin\candle.exe" -? | Select-Object -First 1

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $baseVersion = (Select-String -Path build.gradle.kts -Pattern 'version = .*"([0-9]+\.[0-9]+\.[0-9]+)"').Matches[0].Groups[1].Value
          $releaseVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build, package, and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat clean build packageWindowsMsi packageWindowsZip verifyPackagedFileImports "-PreleaseVersion=${{ steps.version.outputs.release_version }}" --console=plain

      - name: Stage release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.release_version }}'
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item "build/releases/v$version/msi/microProject-$version.msi" "release-assets/microProject-$version.msi"
          Copy-Item "docs/downloads/microProject-$version-app-image.zip" "release-assets/microProject-$version-app-image.zip"
          Copy-Item "release-assets/microProject-$version.msi" "release-assets/microProject-latest.msi"
          Copy-Item "release-assets/microProject-$version-app-image.zip" "release-assets/microProject-latest-app-image.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.release_version }}
          name: microProject v${{ steps.version.outputs.release_version }}
          generate_release_notes: true
          files: release-assets/*

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
