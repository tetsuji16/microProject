name: Release

on:
  push:
    tags: ['v*-beta.*']
    branches: ['release/beta-*', 'release/stable-*']
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel (beta is the default for manual runs)'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      gui_suite:
        description: 'GUI suite for the release gate (smoke is the efficient default)'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      build_unix_packages:
        description: 'Build Linux and macOS packages for a substantial cross-platform update'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-and-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unix-packages:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_unix_packages) || (github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/stable-')) }}
    name: Build ${{ matrix.os }} release package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Install fonts used by report rendering tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Derive package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version=$(sed -nE 's/.*version = .*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' build.gradle.kts | head -n 1)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ '${{ inputs.release_channel }}' == stable ]]; then
              [[ "$GITHUB_REF_NAME" =~ ^release/stable-([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo 'Invalid stable release branch.' >&2; exit 1; }
              [[ "${BASH_REMATCH[1]}" == "$base_version" ]] || { echo 'Stable branch version mismatch.' >&2; exit 1; }
              channel=stable
            else channel=beta; fi
            release_version="$base_version.$GITHUB_RUN_NUMBER"
          elif [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" =~ ^release/(beta|stable)-([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]]; then
            [[ "${BASH_REMATCH[2]}" == "$base_version" ]] || { echo 'Release branch version mismatch.' >&2; exit 1; }
            release_version="$base_version.${BASH_REMATCH[3]}"; channel="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" =~ ^release/stable-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            [[ "${BASH_REMATCH[1]}" == "$base_version" ]] || { echo 'Stable branch version mismatch.' >&2; exit 1; }
            release_version="$base_version.$GITHUB_RUN_NUMBER"; channel=stable
          elif [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta\.([1-9][0-9]*)$ ]]; then
            base_version="${BASH_REMATCH[1]}"
            release_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"; channel=beta
          elif [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$ ]]; then
            base_version="${BASH_REMATCH[1]}"
            release_version="${GITHUB_REF_NAME#v}"; channel=stable
          else echo "Unsupported release ref: $GITHUB_REF_NAME" >&2; exit 1; fi
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Build and package app image
        run: bash ./gradlew clean build prepareWindowsReleaseInput "-PreleaseVersion=${{ steps.version.outputs.release_version }}" "-PreleaseChannel=${{ steps.version.outputs.channel }}" --console=plain
      - name: Package Linux app image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="build/releases/v${{ steps.version.outputs.release_version }}"; mkdir -p "$root"
          jpackage --type app-image --name microProject --app-version '${{ steps.version.outputs.release_version }}' --vendor 'microProject contributors' --description 'microProject desktop project management software' --input "build/releases/v${{ steps.version.outputs.release_version }}/jpackage-input" --main-jar microproject_bootstrap.jar --main-class com.microproject.bootstrap.MicroProjectUpdater --java-options '-Dmicroproject.updates.enabled=false' --dest "$root" --verbose
          test -x "$root/microProject/bin/microProject"
          (cd "$root" && zip -qr "microProject-${{ steps.version.outputs.release_version }}-linux-x64.zip" microProject)
      - name: Package macOS app image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="build/releases/v${{ steps.version.outputs.release_version }}"; mkdir -p "$root"
          # CFBundleVersion requires a positive first component; offset the semantic major for macOS metadata only.
          IFS=. read -r major minor patch <<< '${{ steps.version.outputs.base_version }}'
          macos_app_version="$((10#$major + 1)).$minor.$patch"
          jpackage --type app-image --name microProject --app-version "$macos_app_version" --vendor 'microProject contributors' --description 'microProject desktop project management software' --input "build/releases/v${{ steps.version.outputs.release_version }}/jpackage-input" --main-jar microproject_bootstrap.jar --main-class com.microproject.bootstrap.MicroProjectUpdater --java-options '-Dmicroproject.updates.enabled=false' --dest "$root" --verbose
          test -d "$root/microProject.app"
          (cd "$root" && ditto -c -k --sequesterRsrc --keepParent microProject.app "microProject-${{ steps.version.outputs.release_version }}-macos-aarch64.zip")
      - name: Upload OS package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: build/releases/v${{ steps.version.outputs.release_version }}/microProject-*-*.zip
          if-no-files-found: error
      - name: Upload failed Gradle test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-gradle-test-reports-${{ matrix.platform }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            modules/**/build/test-results/test/*.xml
            modules/**/build/reports/tests/test/**

  release:
    needs: unix-packages
    if: ${{ always() && !cancelled() && (needs.unix-packages.result == 'success' || needs.unix-packages.result == 'skipped') }}
    name: Build and publish Windows release
    runs-on: windows-latest
    # Stable candidates run the full GUI locale/DPI matrix once, at publication.
    timeout-minutes: 180
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install WiX
        shell: pwsh
        run: |
          # JDK 25's jpackage supports WiX 4/5. Use WiX 5 so MSI generation
          # handles all registered file associations, including .mpo.
          dotnet tool install --global wix --version 5.0.2 --add-source https://api.nuget.org/v3/index.json
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          $env:USERPROFILE + '\.dotnet\tools' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix --version

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseVersion = (Select-String -Path build.gradle.kts -Pattern 'version = .*"([0-9]+\.[0-9]+\.[0-9]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $channel = '${{ inputs.release_channel }}'
            if ($channel -notin @('beta', 'stable')) { throw "Unsupported release channel: $channel" }
            if ($channel -eq 'beta') {
              $releaseTag = "v$baseVersion-beta.$env:GITHUB_RUN_NUMBER"
              $releaseVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
              $prerelease = 'true'
            } else {
              if ($env:GITHUB_REF_TYPE -ne 'branch' -or $env:GITHUB_REF_NAME -notmatch '^release/stable-(\d+\.\d+\.\d+)$') {
                throw 'Stable releases must run from a release/stable-MAJOR.MINOR.PATCH branch.'
              }
              if ($Matches[1] -ne $baseVersion) { throw "Stable branch base $($Matches[1]) does not match build.gradle.kts version $baseVersion." }
              $releaseTag = "v$($Matches[1]).$env:GITHUB_RUN_NUMBER"
              $releaseVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
              $prerelease = 'false'
            }
          } else {
            $releaseTag = $env:GITHUB_REF_NAME
            if ($env:GITHUB_REF_TYPE -eq 'branch') {
              if ($releaseTag -match '^release/beta-(\d+\.\d+\.\d+)-([1-9][0-9]*)$') {
                if ($Matches[1] -ne $baseVersion) { throw "Beta branch base $($Matches[1]) does not match build.gradle.kts version $baseVersion." }
                $releaseTag = "v$($Matches[1])-beta.$($Matches[2])"
              } elseif ($releaseTag -match '^release/stable-(\d+\.\d+\.\d+)$') {
                if ($Matches[1] -ne $baseVersion) { throw "Stable branch base $($Matches[1]) does not match build.gradle.kts version $baseVersion." }
                $releaseTag = "v$($Matches[1]).$env:GITHUB_RUN_NUMBER"
              } else {
                throw "Invalid release branch: $releaseTag"
              }
            }
            if ($releaseTag -match '^v(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)-beta\.(?<sequence>0|[1-9][0-9]*)$') {
              $releaseVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch).$($Matches.sequence)"
              $prerelease = 'true'
            } elseif ($releaseTag -match '^v(?<numeric>0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2,3}$') {
              $releaseVersion = $releaseTag.Substring(1)
              $prerelease = 'false'
            } else {
              throw "Invalid release tag '$releaseTag'. Use vMAJOR.MINOR.PATCH-beta.N or a three/four-part numeric stable tag."
            }
          }
          if ($prerelease -eq 'false' -and $env:GITHUB_REF_TYPE -ne 'tag') {
            $existingTag = git ls-remote --tags origin "refs/tags/$releaseTag"
            if ($LASTEXITCODE -ne 0) { throw "Could not check whether stable tag $releaseTag already exists." }
            if (-not [string]::IsNullOrWhiteSpace(($existingTag -join ''))) { throw "Refusing to publish stable release: tag $releaseTag already exists." }
          }
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build, package, and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat clean build packageWindowsAppImage packageWindowsMsi packageWindowsZip verifyPackagedFileImports "-PreleaseVersion=${{ steps.version.outputs.release_version }}" "-PreleaseChannel=${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'stable' }}" --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows GUI acceptance gate
        shell: pwsh
        timeout-minutes: 110
        run: |
          $isStableCandidate = $false
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and '${{ inputs.release_channel }}' -eq 'stable') { $isStableCandidate = $true }
          if ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME -like 'release/stable-*') { $isStableCandidate = $true }
          $requestedSuite = '${{ inputs.gui_suite }}'
          if ([string]::IsNullOrWhiteSpace($requestedSuite)) {
            $requestedSuite = if ($isStableCandidate) { 'full' } else { 'smoke' }
          }
          if ($isStableCandidate -and $requestedSuite -ne 'full') { throw 'Stable releases require gui_suite=full.' }
          if ($isStableCandidate) {
            .\.github\scripts\run-gui-acceptance.ps1 -Suite $requestedSuite -StableReleaseGate
          } else {
            .\.github\scripts\run-gui-acceptance.ps1 -Suite $requestedSuite
          }
      - name: Capture GUI failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnostics = 'modules/microproject_ui/build/reports/guiTest-artifacts'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          Get-Process java,javaw -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,CPU,StartTime,Path |
            Out-File (Join-Path $diagnostics 'java-processes.txt')
           $jcmd = Join-Path $env:JAVA_HOME 'bin/jcmd.exe'
           if (-not (Test-Path -LiteralPath $jcmd)) { $jcmd = 'jcmd' }
           Get-Process java,javaw -ErrorAction SilentlyContinue | ForEach-Object {
             $dump = Join-Path $diagnostics ("thread-dump-$($_.Id).txt")
             & $jcmd $_.Id Thread.print 2>&1 | Out-File $dump
           }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'java|microProject' } |
            Select-Object ProcessId,ParentProcessId,Name,CommandLine |
            Out-File (Join-Path $diagnostics 'java-command-lines.txt')

      - name: Upload GUI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-acceptance-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            modules/microproject_ui/build/reports/tests/guiTest
            modules/microproject_ui/build/test-results/guiTest
            modules/microproject_ui/build/reports/guiTest-artifacts

      - name: Verify packaged contents and launch path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.release_version }}'
          $releaseRoot = Join-Path $PWD "build/releases/v$version"
          $installJar = Join-Path $PWD 'modules/microproject_ui/build/install/microproject_ui/lib/microproject_ui.jar'
          $packagedJar = Join-Path $releaseRoot 'app-image/microProject/app/microproject_ui.jar'
          if (-not (Test-Path -LiteralPath $packagedJar)) { throw "Packaged UI JAR is missing: $packagedJar" }
          $installHash = (Get-FileHash -LiteralPath $installJar -Algorithm SHA256).Hash
          $packagedHash = (Get-FileHash -LiteralPath $packagedJar -Algorithm SHA256).Hash
          if ($installHash -ne $packagedHash) {
            throw "Packaged UI JAR differs from installDist. install=$installHash packaged=$packagedHash"
          }

          $exe = Join-Path $releaseRoot 'app-image/microProject/microProject.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Packaged EXE is missing: $exe" }
          $startedAfter = (Get-Date).AddSeconds(-2)
          $launcher = Start-Process -FilePath $exe -ArgumentList '--launch-only' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $window = $null
            do {
              Start-Sleep -Seconds 1
              $window = Get-Process -Name 'microProject' -ErrorAction SilentlyContinue |
                Where-Object { $_.StartTime -ge $startedAfter -and $_.MainWindowTitle -eq 'microProject' } |
                Select-Object -First 1
            } while ($null -eq $window -and (Get-Date) -lt $deadline)
            if ($null -eq $window) { throw 'Packaged EXE did not create the microProject window within 45 seconds.' }
          } finally {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessId -eq $launcher.Id -or $_.ParentProcessId -eq $launcher.Id } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Download Linux and macOS packages
        if: ${{ needs.unix-packages.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: unix-packages
          merge-multiple: false

      - name: Stage release assets
        id: assets
        if: ${{ success() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.release_version }}'
          New-Item -ItemType Directory -Path release-assets | Out-Null
          if ('${{ needs.unix-packages.result }}' -eq 'success') {
            foreach ($platform in @('linux-x64', 'macos-aarch64')) {
              $packageDir = Join-Path $PWD "unix-packages/package-$platform"
              $package = @(Get-ChildItem -LiteralPath $packageDir -File -Filter "microProject-$version-$platform.zip" -ErrorAction SilentlyContinue)
              if ($package.Count -ne 1) { throw "Expected exactly one $platform package, found $($package.Count)" }
              Copy-Item $package[0].FullName "release-assets/$($package[0].Name)"
            }
          }
          $msiCandidates = @(Get-ChildItem -LiteralPath "build/releases/v$version/msi" -File -Filter '*.msi' -ErrorAction SilentlyContinue)
          if ($msiCandidates.Count -ne 1) { throw "Expected exactly one MSI in build/releases/v$version/msi, found $($msiCandidates.Count)" }
          $msi = $msiCandidates[0]
          $zip = Get-Item "docs/downloads/microProject-$version-app-image.zip" -ErrorAction SilentlyContinue
          if ($null -eq $zip) { throw "The Windows app-image ZIP was not produced for v$version." }
          if ('${{ steps.version.outputs.prerelease }}' -ne 'true') {
            # Stable names stay fixed so /releases/latest/download/ links keep working.
            Copy-Item $msi.FullName "release-assets/microProject-latest.msi"
            Copy-Item $zip.FullName "release-assets/microProject-latest-app-image.zip"
            $tag = '${{ steps.version.outputs.release_tag }}'
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)(?:\.\d+)?$') { throw "Invalid stable release tag: $tag" }
            $notes = "docs/releases/stable-$($Matches[1]).md"
            if (-not (Test-Path -LiteralPath $notes)) { throw "Stable release notes are required: $notes" }
            "notes_path=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Copy-Item $msi.FullName "release-assets/microProject-$version.msi"
            Copy-Item $zip.FullName "release-assets/microProject-$version-app-image.zip"
            $tag = '${{ steps.version.outputs.release_tag }}'
            $base = [regex]::Match($tag, '^v(\d+\.\d+\.\d+)-beta\.\d+$').Groups[1].Value
            $sequence = [regex]::Match($tag, '-beta\.(\d+)$').Groups[1].Value
            $notes = "docs/releases/beta-$base-$sequence.md"
            if (-not (Test-Path -LiteralPath $notes)) { $notes = "docs/releases/beta-$base.md" }
            if (-not (Test-Path -LiteralPath $notes)) { throw "Beta release notes are required: $notes" }
            "notes_path=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Create GitHub release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: microProject ${{ steps.version.outputs.release_tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: ${{ steps.version.outputs.prerelease != 'true' }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.assets.outputs.notes_path }}
          files: release-assets/*

  pages:
    name: Deploy documentation to GitHub Pages
    needs: release
    # Pages uses the default-branch deployment path. A beta management branch
    # must not request a deployment from the protected github-pages environment.
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
