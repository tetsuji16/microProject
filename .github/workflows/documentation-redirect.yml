name: Deploy documentation redirects
on:
  push:
    branches: [master]
    paths: ['docs/**', 'website/**', 'pages-redirect/**', '.github/workflows/documentation-redirect.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - uses: actions/deploy-pages@v4
        id: deployment
