name: Store MSIX

# Manually dispatched: builds the Windows app-image and packs it as an
# unsigned .msix for Microsoft Store submission (issue #1256). The Store
# re-signs the package during submission, so no signing is done here.
# The release workflow (release-and-pages.yml) is not affected.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version of the app-image, for example 0.1.0.1324. The MSIX package version is derived from it with a zero revision (0.1.1324.0), as Microsoft Store requires.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: store-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-msix:
    name: Build Store MSIX package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "Invalid release version: $version" }
          "release_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
      - name: Build Windows app image
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: .\gradlew.bat packageWindowsAppImage "-PreleaseVersion=$env:RELEASE_VERSION" --console=plain
      - name: Pack MSIX
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          & packaging\windows\store\build-msix.ps1 `
            -AppImageDir "build\releases\v$env:RELEASE_VERSION\app-image\microProject" `
            -Version $env:RELEASE_VERSION `
            -OutputDir "build\store-msix-output"
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microProject-msix-${{ steps.version.outputs.release_version }}
          path: build/store-msix-output/*.msix
          if-no-files-found: error
