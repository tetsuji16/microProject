name: Store MSIX

# Manually dispatched: builds the Windows app-image and packs it as an
# unsigned .msix for Microsoft Store submission (issue #1256). The Store
# re-signs the package during submission, so no signing is done here.
# The release workflow (release-and-pages.yml) is not affected.

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Package version (three or four numeric components). Empty: build default version plus the run number.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: store-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-msix:
    name: Build Store MSIX package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Derive package version
        id: version
        shell: pwsh
        run: |
          $requested = '${{ inputs.package_version }}'.Trim()
          if ($requested) {
            $parts = $requested.TrimStart('v') -split '\.'
          } else {
            $buildFile = Get-Content build.gradle.kts -Raw
            $base = '0.1.0'
            if ($buildFile -match 'getOrElse\("([0-9]+\.[0-9]+\.[0-9]+)"\)') { $base = $Matches[1] }
            $parts = @($base -split '\.') + '${{ github.run_number }}'
          }
          if ($parts.Count -lt 3 -or $parts.Count -gt 4) { throw "Invalid package version: $requested" }
          while ($parts.Count -lt 4) { $parts += '0' }
          $version = $parts -join '.'
          "package_version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version"
      - name: Build Windows app image
        shell: pwsh
        run: .\gradlew.bat packageWindowsAppImage "-PreleaseVersion=${{ steps.version.outputs.package_version }}" --console=plain
      - name: Pack MSIX
        shell: pwsh
        run: |
          & packaging\windows\store\build-msix.ps1 `
            -AppImageDir "build\releases\v${{ steps.version.outputs.package_version }}\app-image\microProject" `
            -Version "${{ steps.version.outputs.package_version }}" `
            -OutputDir "build\store-msix-output"
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microProject-msix-${{ steps.version.outputs.package_version }}
          path: build/store-msix-output/*.msix
          if-no-files-found: error
